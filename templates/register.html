<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ثبت‌نام — سایت آرزوها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0f14;--surface:#161b25;--card:#1e2535;--accent:#4f8ef7;--accent2:#a78bfa;--text:#e8eaf0;--muted:#6b7280;--border:rgba(255,255,255,0.07)}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
body::before{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(79,142,247,0.1) 0%,transparent 70%);pointer-events:none}
.box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:420px}
.logo{display:block;text-align:center;font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none;margin-bottom:0.5rem}
h2{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:0.4rem}
.sub{text-align:center;color:var(--muted);font-size:0.87rem;margin-bottom:2rem}
label{display:block;font-size:0.85rem;color:var(--muted);margin-bottom:0.4rem;margin-top:0.25rem}
input{width:100%;padding:0.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Vazirmatn',sans-serif;font-size:0.95rem;margin-bottom:0.25rem;transition:border-color 0.2s;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:0.85rem;border-radius:10px;font-family:'Vazirmatn',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,var(--accent),#3b6fd4);color:#fff;margin-top:1.25rem;transition:all 0.2s}
.btn:hover{transform:translateY(-1px)}
.link{text-align:center;margin-top:1.25rem;font-size:0.87rem;color:var(--muted)}
.link a{color:var(--accent);text-decoration:none}
.flash{padding:0.65rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:0.85rem}
.flash-error{background:rgba(248,113,113,0.12);border:1px solid rgba(248,113,113,0.3);color:#f87171}
.flash-success{background:rgba(52,211,153,0.12);border:1px solid rgba(52,211,153,0.3);color:#34d399}
</style>
</head>
<body>
<div class="box">
  <a href="/" class="logo">🌟 سایت آرزوها</a>
  <h2>ثبت‌نام</h2>
  <p class="sub">حساب بساز و آرزوت رو ثبت کن</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash flash-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  <form method="POST">
    <label>نام کاربری</label>
    <input type="text" name="username" placeholder="مثلاً: ali123" required minlength="3"/>
    <label>ایمیل</label>
    <input type="email" name="email" placeholder="example@email.com" required/>
    <label>رمز عبور</label>
    <input type="password" name="password" placeholder="حداقل ۶ کاراکتر" required minlength="6"/>
    <button type="submit" class="btn">ثبت‌نام ✨</button>
  </form>
  <div class="link">قبلاً ثبت‌نام کردی؟ <a href="/login">وارد شو</a></div>
</div>
</body>
</html>
